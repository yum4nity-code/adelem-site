name: Adelem visual QA
on:
  push:
    branches:
      - v5-homepage-art-direction
    paths:
      - .github/workflows/adelem-visual-qa.yml
      - site-v5/**
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull validated images from Drive
        working-directory: site-v5
        run: |
          mkdir -p assets/generated
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1J3BenGQ1zOqhBAr7imvFc3hqYAkrwKtG&export=download&confirm=t" -o assets/generated/adelem-hero.webp
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1FglPu2UJy8epXoWyFnL1GOxU1kym2kiE&export=download&confirm=t" -o assets/generated/adelem-geste.webp
      - name: Start local V5
        run: |
          python -m http.server 4173 --directory site-v5 >/tmp/adelem-http.log 2>&1 &
          sleep 2
      - uses: browser-actions/setup-chrome@v1
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Capture live V5
        run: |
          cat > /tmp/capture.py <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time, os

          URL="http://127.0.0.1:4173/"
          sections=[
              ("hero",None),
              ("material",".material"),
              ("gesture",".gesture"),
              ("gallery",".gallery"),
              ("frames",".frames"),
              ("portal",".portal"),
              ("closing",".closing"),
          ]

          def browser(w,h):
              o=Options()
              o.add_argument("--headless=new")
              o.add_argument("--no-sandbox")
              o.add_argument("--disable-dev-shm-usage")
              o.add_argument(f"--window-size={w},{h}")
              return webdriver.Chrome(options=o)

          def section_progress(d,selector,progress):
              el=d.execute_script("return document.querySelector(arguments[0])",selector)
              if not el:
                  return False
              d.execute_script("""
                  const el=arguments[0], p=arguments[1];
                  const top=el.getBoundingClientRect().top+window.scrollY;
                  const travel=Math.max(0,el.offsetHeight-window.innerHeight);
                  window.scrollTo(0,top+travel*p);
              """,el,progress)
              time.sleep(1.1)
              return True

          os.makedirs("qa",exist_ok=True)
          d=browser(1440,1200)
          try:
              d.get(URL); time.sleep(4)
              for name,sel in sections:
                  if sel:
                      el=d.execute_script("return document.querySelector(arguments[0])",sel)
                      if not el:
                          continue
                      d.execute_script("arguments[0].scrollIntoView({block:'start'})",el)
                      time.sleep(.8)
                  else:
                      d.execute_script("window.scrollTo(0,0)"); time.sleep(.8)
                  d.save_screenshot(f"qa/desktop-{name}.png")

              if section_progress(d,".hero-portal",.76):
                  d.save_screenshot("qa/desktop-hero-reveal.png")
              if section_progress(d,".material-reveal",.76):
                  d.save_screenshot("qa/desktop-material-reveal.png")
              if section_progress(d,".gesture-sequence",.46):
                  d.save_screenshot("qa/desktop-gesture-mid.png")
              if section_progress(d,".gesture-sequence",.90):
                  d.save_screenshot("qa/desktop-gesture-end.png")
          finally:
              d.quit()

          d=browser(390,844)
          try:
              d.get(URL); time.sleep(4)
              for name,sel in [sections[0],sections[3],sections[-1]]:
                  if sel:
                      el=d.execute_script("return document.querySelector(arguments[0])",sel)
                      if not el:
                          continue
                      d.execute_script("arguments[0].scrollIntoView({block:'start'})",el)
                      time.sleep(.8)
                  else:
                      d.execute_script("window.scrollTo(0,0)"); time.sleep(.8)
                  d.save_screenshot(f"qa/mobile-{name}.png")

              if section_progress(d,".hero-portal",.76):
                  d.save_screenshot("qa/mobile-hero-reveal.png")
              if section_progress(d,".material-reveal",.76):
                  d.save_screenshot("qa/mobile-material-reveal.png")
              if section_progress(d,".gesture-sequence",.46):
                  d.save_screenshot("qa/mobile-gesture-mid.png")
              if section_progress(d,".gesture-sequence",.90):
                  d.save_screenshot("qa/mobile-gesture-end.png")
          finally:
              d.quit()
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: adelem-live-visual-qa
          path: qa/*.png
          if-no-files-found: error
