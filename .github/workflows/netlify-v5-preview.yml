name: Deploy Adelem V5 preview
on:
  push:
    branches:
      - v5-homepage-art-direction
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull validated images from Drive
        working-directory: site-v5
        run: |
          mkdir -p assets/generated
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1J3BenGQ1zOqhBAr7imvFc3hqYAkrwKtG&export=download&confirm=t" -o assets/generated/adelem-hero.webp
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1FglPu2UJy8epXoWyFnL1GOxU1kym2kiE&export=download&confirm=t" -o assets/generated/adelem-geste.webp
          test $(stat -c%s assets/generated/adelem-hero.webp) -gt 50000
          test $(stat -c%s assets/generated/adelem-geste.webp) -gt 50000
      - name: Deploy site-v5 to Netlify
        working-directory: site-v5
        run: >
          npx -y @netlify/mcp@latest
          --site-id b7879588-731e-402d-a773-2c48208e8eaf
          --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..g2FJ-Nz8AWggBBqd.MgGYGNBMFOgA-7DdLcq0-JoVI1r6iApL-rA2gko_xrmSV-fIC6W84lM5cmgBpjLz48yg_cSHRzbyp1uvaDFUSx2yG9BhUQAdlkdqe8KWPNBK8RuFFcZyRjVgV195Qj8yTmktlZVUq9cuzgGSe2EQPQTiskNSfCBxLXgWVrzGVya91FbUyGWWu9eJFrjbgReaSxtueA_TotA807z99R-QgnOm1AekKs-HZEh2L0qVCAL7SLDa_5dCZ7xFSfiHF-STEA6rpR_ZxLqdfcWP-6Mjg843BpUfKHOgM1H9q_kcS-l_Ql_6K-0D0mfHpTyiOoK9OFaXRhVaZt0aIqHzXd8GwO2vScm_PjjJCOQOmWp9RktRMVIVpA8cZWuhxOQakWtQQmyhgAMf.1zENSR9F4bgtEJnjxroLNA"
      - uses: browser-actions/setup-chrome@v1
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Capture desktop and mobile
        run: |
          cat > /tmp/capture.py <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          URL="https://adelem-v5-preview.netlify.app/"

          def shot(width,height,name,scroll=None):
              opts=Options()
              opts.add_argument("--headless=new")
              opts.add_argument("--no-sandbox")
              opts.add_argument("--disable-dev-shm-usage")
              opts.add_argument(f"--window-size={width},{height}")
              d=webdriver.Chrome(options=opts)
              try:
                  d.get(URL)
                  time.sleep(4)
                  if scroll:
                      d.execute_script(scroll)
                      time.sleep(1)
                  d.save_screenshot(name)
              finally:
                  d.quit()

          shot(1440,1200,"desktop-hero.png")
          shot(1440,1200,"desktop-gesture.png","document.querySelector('.gesture').scrollIntoView({block:'start'})")
          shot(390,844,"mobile-hero.png")
          shot(390,844,"mobile-gesture.png","document.querySelector('.gesture').scrollIntoView({block:'start'})")
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: adelem-v5-visual-qa
          path: |
            desktop-hero.png
            desktop-gesture.png
            mobile-hero.png
            mobile-gesture.png
          if-no-files-found: error
