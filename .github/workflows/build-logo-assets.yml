name: Build AdeleM logo assets

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/logo/master/adelem-original-master.png'
      - 'scripts/build_logo_assets.py'
      - '.github/workflows/build-logo-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Build logo assets
        run: python scripts/build_logo_assets.py
      - name: Commit generated assets
        run: |
          rm -f site/assets/.gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/assets/logo site/assets/.gitkeep
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build AdeleM logo assets [skip ci]"
            git push
          fi
