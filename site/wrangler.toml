# Cloudflare Pages (préparé le 2026-11-02, hébergement envisagé à la place de Vercel Hobby, interdit en usage commercial).
# Projet Pages : répertoire racine = « site », commande de construction ci-dessous, dossier de sortie = « dist ».
#   Construction : cd ../site-astro && npm ci && npm run build && rm -rf ../site/dist && cp -r dist ../site/dist
# Clés secrètes à créer dans Cloudflare (Settings › Variables and Secrets) : STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET,
# SANITY_WRITE_TOKEN. Ne jamais les écrire ici.
name = "adelem"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
